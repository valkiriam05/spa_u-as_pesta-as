<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
            <h1 class="card-title text-center mb-4">Iniciar Sesión</h1>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Nombre de Usuario:</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña:</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Recordarme</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Iniciar Sesión</button>
            </form>
            <p class="text-center mb-2">¿No tienes cuenta? <a href="/frontend/assets/registro.html" class="link-primary">Registrarse</a></p>
            <p class="text-center"><a href="/frontend/assets/index.html" class="link-secondary">Volver a la página de inicio</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 
    <script>        
document.getElementById('loginForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const correo = document.getElementById('username').value;
    const contraseña = document.getElementById('password').value;
    try {
        const respuesta = await fetch('http://localhost:3000/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                correo: correo,
                contraseña: contraseña
            })
        });
        const resultado = await respuesta.json();
        console.log(resultado);
        if (resultado.success) {
           localStorage.setItem('usuarioActivo', resultado.nombre);
           localStorage.setItem('generoUsuario', resultado.genero);
            alert('¡Inicio de sesión exitoso!');
            window.location.href = 'index.html';
        } else {
            alert(resultado.message || 'Correo o contraseña incorrectos.');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error al conectar con el servidor.');
    }
});
</script>
</body>

</html>
