<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
            <h1 class="card-title text-center mb-4">Iniciar Sesión</h1>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Nombre de Usuario:</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña:</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Recordarme</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Iniciar Sesión</button>
            </form>
            <p class="text-center mb-2">¿No tienes cuenta? <a href="/frontend/assets/registro.html" class="link-primary">Registrarse</a></p>
            <p class="text-center"><a href="/frontend/assets/index.html" class="link-secondary">Volver a la página de inicio</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 
    <script>        
document.getElementById('loginForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const correo = document.getElementById('username').value;
    const contraseña = document.getElementById('password').value;
    try {
        const respuesta = await fetch('http://localhost:3000/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                correo: correo,
                contraseña: contraseña
            })
        });
        const resultado = await respuesta.json();
        console.log(resultado);
        if (resultado.success) {
           localStorage.setItem('usuarioActivo', resultado.nombre);
           localStorage.setItem('generoUsuario', resultado.genero);
            alert('¡Inicio de sesión exitoso!');
            window.location.href = 'index.html';
        } else {
            alert(resultado.message || 'Correo o contraseña incorrectos.');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error al conectar con el servidor.');
    }
});
</script>
</body>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Botón flotante de WhatsApp</title>
<style>
  :root{
    --wa-green: #4ADE80;
    --wa-green-dark: #22C55E;
    --wa-teal: #16A34A;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    background:#ECE5DD;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0, transparent 40%);
    overflow:hidden;
  }

  .fab-wrap{
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:50;
  }
  .fab{
    width:60px;
    height:60px;
    border-radius:50%;
    background: linear-gradient(145deg, var(--wa-green), var(--wa-green-dark));
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 6px 18px rgba(22,163,74,0.35), 0 2px 6px rgba(0,0,0,0.15);
    position:relative;
    transition: transform .18s ease, box-shadow .18s ease;
    text-decoration:none;
  }
  .fab:hover{
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 10px 24px rgba(22,163,74,0.4), 0 3px 8px rgba(0,0,0,0.18);
  }
  .fab:active{ transform: scale(0.96); }

  .fab svg{ width:34px; height:34px; }

  .ping{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid var(--wa-green);
    animation: ping 2.4s ease-out infinite;
    pointer-events:none;
  }
  @keyframes ping{
    0%   { transform:scale(1);   opacity:.55; }
    80%  { transform:scale(1.6); opacity:0; }
    100% { transform:scale(1.6); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .ping{ animation:none; display:none; }
  }

  .tooltip{
    position:absolute;
    right:72px;
    top:50%;
    transform: translateY(-50%) translateX(6px);
    background:#111827;
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .tooltip::after{
    content:"";
    position:absolute;
    right:-5px;
    top:50%;
    transform: translateY(-50%);
    border-width:5px 0 5px 5px;
    border-style:solid;
    border-color:transparent transparent transparent #111827;
  }
  .fab-wrap:hover .tooltip{
    opacity:1;
    transform: translateY(-50%) translateX(0);
  }

  .hint{
    position:fixed;
    bottom:20px;
    left:0; right:0;
    text-align:center;
    font-size:12px;
    color:#667781;
  }
</style>
</head>
<body>

<div class="hint">Haz clic en el ícono para escribirnos por WhatsApp</div>

</div>

<script>
(function(){
  const phone = "3232967030"; // +57 3232967030, sin signos ni espacios
  const message = "Hola, quisiera información de su spa de uñas: ¿qué servicios ofrecen (manicura, pedicura, acrílicas, gel, semipermanente, nail art), precios y tienen paquetes o promociones? ¿Qué productos usan, tienen opciones hipoalergénicas y cómo garantizan la higiene? ¿Atienden con o sin cita, cuánto dura cada servicio, hay servicio a domicilio y cuál es el horario? ¿Qué garantias de retoques manejan y qué métodos de pago aceptan? ¡Gracias!";

</body>
</html>
